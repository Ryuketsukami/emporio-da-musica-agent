# Anthropic API list prices, in US dollars per million tokens (checked 2026-10-31).
# cache_write is the 5-minute cache rate (1.25x input), the one the SDK backend uses;
# cache_read is 0.1x input. A model that is not listed here gets no cost (null), never a guess.
# A dated model id ("claude-haiku-4-5-20251001") uses the entry for its base name.

[claude-sonnet-5]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.20

[claude-haiku-4-5]
input = 1.00
output = 5.00
cache_write = 1.25
cache_read = 0.10
